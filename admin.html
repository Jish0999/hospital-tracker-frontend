<!DOCTYPE html>
<html>
<head>
  <title>Hospital Tracker – Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
  /* 🔒 Hard gate: admin UI hidden until JS explicitly shows it */
  #adminApp { display: none !important; }
  </style>
</head>
<body>
  <div class="container">

    <!-- 🔐 Login -->
    <div id="loginBox" class="card">
      <h2>🔐 Admin Login</h2>
      <input id="adminPass" type="password" placeholder="Enter admin password" />
      <button id="loginBtn">Login</button>
      <p id="loginError" style="color:#c00; display:none;">Invalid password</p>
    </div>

    <!-- 🧑‍💼 Admin App (HIDDEN BY DEFAULT) -->
    <div id="adminApp" style="display:none;">
      <h1>🏥 Admin Panel</h1>

      <form id="hospitalForm">
        <input id="name" placeholder="Name" required />
        <input id="district" placeholder="District" required />
        <input id="city" placeholder="City" required />
        <input id="type" placeholder="Type (Private/Government)" required />
        <input id="address" placeholder="Address" required />
        <input id="phone" placeholder="Phone" required />
        <input id="lat" placeholder="Latitude" required />
        <input id="lng" placeholder="Longitude" required />
        <input id="specialties" placeholder="Specialties (comma separated)" required />
        <label>
          24/7 Emergency
          <input type="checkbox" id="emergency24x7" />
        </label>
        <button type="submit">Save Hospital</button>
      </form>

      <h2>Existing Hospitals</h2>
      <div id="list"></div>
    </div>

  </div>

  <!-- ⚠️ Script must be last -->
  <script src="admin.js"></script>
</body>
</html>
